<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>泡泡龍大作戰 - Puzzle Bobble Arcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #090d16;
            font-family: 'Zen Maru Gothic', sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        .neon-text-cyan { text-shadow: 0 0 10px rgba(6, 182, 212, 0.8); }
        .neon-text-pink { text-shadow: 0 0 10px rgba(236, 72, 153, 0.8); }
        .neon-text-yellow { text-shadow: 0 0 10px rgba(234, 179, 8, 0.8); }
        
        /* 避免 Safe Area 遮擋 */
        .safe-padding {
            padding-top: max(12px, env(safe-area-inset-top));
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            padding-left: max(12px, env(safe-area-inset-left));
            padding-right: max(12px, env(safe-area-inset-right));
        }
    </style>
</head>
<body class="relative w-full h-full text-white overflow-hidden">

    <canvas id="gameCanvas"></canvas>

    <div id="hud" class="fixed top-0 left-0 w-full z-10 pointer-events-none safe-padding flex flex-col items-center">
        <div class="glass-panel rounded-2xl px-4 py-2 flex items-center justify-between w-[95%] max-w-4xl text-xs md:text-sm pointer-events-auto transition-all">
            <div class="flex items-center space-x-3 md:space-x-6">
                <div>🎯 LV: <span id="hud-level" class="font-bold text-cyan-400 neon-text-cyan">1</span></div>
                <div>⭐ SCORE: <span id="hud-score" class="font-bold text-yellow-300 neon-text-yellow">0</span></div>
                <div class="hidden sm:block">🏆 HIGH: <span id="hud-high" class="font-bold text-pink-400 neon-text-pink">0</span></div>
                <div>🔥 COMBO: <span id="hud-combo" class="font-bold text-orange-400">x0</span></div>
            </div>
            
            <div class="flex items-center space-x-2 md:space-x-4">
                <div class="hidden md:flex items-center space-x-1">
                    <span class="text-xs text-slate-400">MISS:</span>
                    <span id="hud-miss" class="text-red-400 font-bold">0/5</span>
                </div>
                <button id="btn-bgm" class="px-2 py-1 rounded bg-slate-800/80 hover:bg-slate-700 text-xs border border-slate-600">🎵 ON</button>
                <button id="btn-sfx" class="px-2 py-1 rounded bg-slate-800/80 hover:bg-slate-700 text-xs border border-slate-600">🔊 ON</button>
                <button id="btn-pause" class="px-2.5 py-1 rounded bg-cyan-600/80 hover:bg-cyan-500 text-xs font-bold border border-cyan-400">⏸</button>
                <button id="btn-restart" class="px-2.5 py-1 rounded bg-red-600/80 hover:bg-red-500 text-xs font-bold border border-red-400">🔄</button>
            </div>
        </div>
    </div>

    <div id="modal-container" class="fixed inset-0 z-20 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md transition-opacity duration-300">
        
        <div id="modal-start" class="glass-panel rounded-3xl p-6 md:p-8 max-w-md w-full text-center space-y-6">
            <div class="space-y-2">
                <h1 class="text-3xl md:text-4xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-purple-400 to-cyan-400 neon-text-cyan">
                    🐉 泡泡龍大作戰
                </h1>
                <p class="text-xs md:text-sm text-cyan-200 tracking-widest font-bold">PUZZLE BOBBLE ARCADE</p>
            </div>

            <div class="py-2 flex justify-center space-x-1">
                <span class="text-yellow-400 text-xl">★</span>
                <span class="text-yellow-400 text-xl">★</span>
                <span class="text-yellow-400 text-xl">★</span>
                <span class="text-yellow-400 text-xl">★</span>
                <span class="text-yellow-400 text-xl">★</span>
            </div>

            <div class="bg-slate-900/60 p-4 rounded-xl text-left text-xs md:text-sm space-y-2 border border-slate-700/50">
                <p class="text-slate-300 font-bold border-b border-slate-700 pb-1">🎮 操作說明：</p>
                <p class="text-slate-400">🖱️/👆 滑鼠與觸控：移動瞄準，點擊發射</p>
                <p class="text-slate-400">⌨️ 鍵盤：A/D 或 ←/→ 瞄準，Space 發射</p>
                <p class="text-slate-400">⏸ 鍵盤 P / ESC：暫停遊戲</p>
            </div>

            <div class="text-sm font-bold text-slate-300">
                最高紀錄：<span id="start-high-score" class="text-yellow-400 text-base">0</span>
            </div>

            <button id="btn-start-game" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 font-black text-lg tracking-wider shadow-lg shadow-cyan-500/30 transform active:scale-95 transition">
                開始遊戲 (START)
            </button>
        </div>

        <div id="modal-pause" class="glass-panel rounded-3xl p-6 md:p-8 max-w-sm w-full text-center space-y-6 hidden">
            <h2 class="text-3xl font-black text-cyan-300 neon-text-cyan">⏸ 遊戲暫停</h2>
            <div class="space-y-3">
                <button id="btn-resume" class="w-full py-3 rounded-xl bg-cyan-600 hover:bg-cyan-500 font-bold text-base shadow-md">
                    繼續遊戲
                </button>
                <button id="btn-pause-restart" class="w-full py-3 rounded-xl bg-slate-700 hover:bg-slate-600 font-bold text-base border border-slate-500">
                    重新開始
                </button>
            </div>
        </div>

        <div id="modal-clear" class="glass-panel rounded-3xl p-6 md:p-8 max-w-sm w-full text-center space-y-5 hidden">
            <h2 class="text-3xl font-black text-yellow-300 neon-text-yellow">🎉 LEVEL CLEAR!</h2>
            <div class="space-y-2 bg-slate-900/60 p-4 rounded-xl border border-slate-700/50 text-sm">
                <div class="flex justify-between text-slate-300"><span>過關獎勵</span><span id="clear-bonus" class="text-yellow-400 font-bold">+1000</span></div>
                <div class="flex justify-between text-slate-300"><span>最高 Combo</span><span id="clear-combo" class="text-orange-400 font-bold">x3</span></div>
                <hr class="border-slate-700">
                <div class="flex justify-between text-base font-bold text-white"><span>總得分</span><span id="clear-total-score" class="text-cyan-400">12500</span></div>
            </div>
            <button id="btn-next-level" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-400 hover:to-emerald-500 font-black text-lg shadow-lg shadow-green-500/30 active:scale-95 transition">
                進入下一關
            </button>
        </div>

        <div id="modal-gameover" class="glass-panel rounded-3xl p-6 md:p-8 max-w-sm w-full text-center space-y-5 hidden">
            <h2 class="text-3xl font-black text-red-500 neon-text-pink">GAME OVER</h2>
            <p id="gameover-new-high" class="text-xs font-bold text-yellow-300 animate-pulse hidden">✨ NEW HIGH SCORE! ✨</p>
            <div class="space-y-2 bg-slate-900/60 p-4 rounded-xl border border-slate-700/50 text-sm">
                <div class="flex justify-between text-slate-300"><span>最終得分</span><span id="gameover-score" class="text-white font-bold">0</span></div>
                <div class="flex justify-between text-slate-300"><span>最高分數</span><span id="gameover-high" class="text-yellow-400 font-bold">0</span></div>
            </div>
            <button id="btn-gameover-restart" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-red-500 to-pink-600 hover:from-red-400 hover:to-pink-500 font-black text-lg shadow-lg shadow-red-500/30 active:scale-95 transition">
                再試一次
            </button>
        </div>
    </div>

    <script>
    (() => {
        // --- 1. CONFIG & CONSTANTS ---
        const BUBBLE_COLORS = {
            RED:      { main: '#ef4444', light: '#fca5a5', dark: '#991b1b', shadow: 'rgba(239,68,68,0.6)' },
            YELLOW:   { main: '#eab308', light: '#fef08a', dark: '#854d0e', shadow: 'rgba(234,179,8,0.6)' },
            GREEN:    { main: '#22c55e', light: '#86efac', dark: '#166534', shadow: 'rgba(34,197,94,0.6)' },
            BLUE:     { main: '#3b82f6', light: '#93c5fd', dark: '#1e40af', shadow: 'rgba(59,130,246,0.6)' },
            PURPLE:   { main: '#a855f7', light: '#d8b4fe', dark: '#6b21a8', shadow: 'rgba(168,85,247,0.6)' },
            PINK:     { main: '#ec4899', light: '#fbcfe8', dark: '#9d174d', shadow: 'rgba(236,72,153,0.6)' }
        };

        const SPECIAL_TYPES = {
            NONE: 'none',
            RAINBOW: 'rainbow',
            BOMB: 'bomb',
            LIGHTNING: 'lightning'
        };

        const GAME_STATES = {
            MENU: 'MENU',
            PLAYING: 'PLAYING',
            PAUSED: 'PAUSED',
            LEVEL_CLEAR: 'LEVEL_CLEAR',
            GAME_OVER: 'GAME_OVER'
        };

        const GRID_ROWS = 12;
        const GRID_COLS = 8;
        const MISS_LIMIT = 5;

        // --- 2. AUDIO SYSTEM (Web Audio API Engine) ---
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.bgmGain = null;
                this.sfxGain = null;
                this.bgmEnabled = true;
                this.sfxEnabled = true;
                this.bgmTimer = null;
                this.step = 0;
            }

            init() {
                if (this.ctx) return;
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioCtx();

                this.bgmGain = this.ctx.createGain();
                this.sfxGain = this.ctx.createGain();

                this.bgmGain.connect(this.ctx.destination);
                this.sfxGain.connect(this.ctx.destination);

                this.setBGMVolume(this.bgmEnabled ? 0.15 : 0);
                this.setSFXVolume(this.sfxEnabled ? 0.3 : 0);
            }

            resume() {
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            setBGMVolume(vol) { if (this.bgmGain) this.bgmGain.gain.value = vol; }
            setSFXVolume(vol) { if (this.sfxGain) this.sfxGain.gain.value = vol; }

            playTone(freq, type, duration, gainVal = 1) {
                if (!this.sfxEnabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    g.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(g);
                    g.connect(this.sfxGain);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e){}
            }

            playShoot() {
                if (!this.sfxEnabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.15);
                    g.gain.setValueAtTime(0.5, this.ctx.currentTime);
                    g.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                    osc.connect(g);
                    g.connect(this.sfxGain);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.15);
                } catch(e){}
            }

            playBounce() { this.playTone(300, 'triangle', 0.05, 0.4); }
            playSnap() { this.playTone(200, 'sine', 0.08, 0.5); }
            playPop() { this.playTone(600, 'sine', 0.1, 0.6); }

            playCombo(count) {
                const baseFreq = 400 + Math.min(count, 10) * 80;
                this.playTone(baseFreq, 'square', 0.15, 0.5);
            }

            playDrop() {
                if (!this.sfxEnabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(500, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(100, this.ctx.currentTime + 0.25);
                    g.gain.setValueAtTime(0.4, this.ctx.currentTime);
                    g.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                    osc.connect(g);
                    g.connect(this.sfxGain);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.25);
                } catch(e){}
            }

            playExplosion() {
                if (!this.sfxEnabled || !this.ctx) return;
                try {
                    const bufferSize = this.ctx.sampleRate * 0.3;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    const noise = this.ctx.createBufferSource();
                    noise.buffer = buffer;
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(800, this.ctx.currentTime);
                    filter.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + 0.3);
                    const g = this.ctx.createGain();
                    g.gain.setValueAtTime(0.8, this.ctx.currentTime);
                    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                    noise.connect(filter);
                    filter.connect(g);
                    g.connect(this.sfxGain);
                    noise.start();
                } catch(e){}
            }

            playWin() {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 'triangle', 0.2, 0.6), i * 120);
                });
            }

            playLose() {
                const notes = [400, 350, 300, 250];
                notes.forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 'sawtooth', 0.25, 0.5), i * 150);
                });
            }

            startBGM() {
                if (this.bgmTimer) return;
                const notes = [261.63, 329.63, 392.00, 329.63, 293.66, 349.23, 440.00, 349.23];
                this.bgmTimer = setInterval(() => {
                    if (!this.bgmEnabled || !this.ctx || this.ctx.state !== 'running') return;
                    try {
                        const freq = notes[this.step % notes.length];
                        const osc = this.ctx.createOscillator();
                        const g = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                        g.gain.setValueAtTime(0.08, this.ctx.currentTime);
                        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
                        osc.connect(g);
                        g.connect(this.bgmGain);
                        osc.start();
                        osc.stop(this.ctx.currentTime + 0.2);
                        this.step++;
                    } catch(e){}
                }, 220);
            }

            stopBGM() {
                if (this.bgmTimer) {
                    clearInterval(this.bgmTimer);
                    this.bgmTimer = null;
                }
            }
        }

        const sound = new SoundEngine();

        // --- 3. STATE & STORAGE MANAGEMENT ---
        let gameState = GAME_STATES.MENU;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('pb_highScore') || '0', 10);
        let level = 1;
        let combo = 0;
        let missCount = 0;
        let powerUpTimer = 0;
        let activePowerUp = null; // 'aimGuide'

        sound.bgmEnabled = localStorage.getItem('pb_bgm') !== 'false';
        sound.sfxEnabled = localStorage.getItem('pb_sfx') !== 'false';

        // --- 4. CANVAS & DISPLAY SYSTEM (DPR SCALING) ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let dpr = window.devicePixelRatio || 1;

        let viewportWidth = window.innerWidth;
        let viewportHeight = window.innerHeight;

        let gameArea = { x: 0, y: 0, width: 0, height: 0 };
        let bubbleRadius = 20;
        let rowHeight = 35;

        function resizeCanvas() {
            viewportWidth = window.innerWidth;
            viewportHeight = window.innerHeight;
            dpr = window.devicePixelRatio || 1;

            canvas.width = viewportWidth * dpr;
            canvas.height = viewportHeight * dpr;
            canvas.style.width = viewportWidth + 'px';
            canvas.style.height = viewportHeight + 'px';

            ctx.scale(dpr, dpr);

            // 計算街機比例遊戲區域
            const maxGameWidth = Math.min(viewportWidth * 0.95, 520);
            const gameHeight = viewportHeight;
            gameArea.width = maxGameWidth;
            gameArea.height = gameHeight;
            gameArea.x = (viewportWidth - gameArea.width) / 2;
            gameArea.y = 0;

            // 動態計算泡泡大小 (以 grid 特徵)
            bubbleRadius = gameArea.width / (GRID_COLS + 0.5) / 2;
            rowHeight = bubbleRadius * Math.sqrt(3);

            if (cannon) {
                cannon.x = gameArea.x + gameArea.width / 2;
                cannon.y = gameArea.height - Math.max(60, bubbleRadius * 2.5);
            }
        }

        // --- 5. GRID & BUBBLE LOGIC ---
        let grid = [];

        function initGrid() {
            grid = [];
            for (let r = 0; r < GRID_ROWS + 4; r++) {
                grid[r] = [];
                for (let c = 0; c < GRID_COLS; c++) {
                    grid[r][c] = null;
                }
            }
        }

        function getBubbleCenter(row, col) {
            const isOdd = row % 2 !== 0;
            const xOffset = isOdd ? bubbleRadius : 0;
            const x = gameArea.x + bubbleRadius + col * (bubbleRadius * 2) + xOffset;
            const y = gameArea.y + 65 + row * rowHeight + bubbleRadius; // 避開 HUD
            return { x, y };
        }

        function getAvailableColorsInGrid() {
            const colors = new Set();
            for (let r = 0; r < grid.length; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    if (grid[r][c] && grid[r][c].active && grid[r][c].colorKey) {
                        colors.add(grid[r][c].colorKey);
                    }
                }
            }
            const colorKeys = Array.from(colors);
            return colorKeys.length > 0 ? colorKeys : Object.keys(BUBBLE_COLORS);
        }

        function createRandomBubbleData(colorKeysAllowed) {
            const keys = colorKeysAllowed || getAvailableColorsInGrid();
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            
            // 機率產生特殊泡泡
            let special = SPECIAL_TYPES.NONE;
            const randSpecial = Math.random();
            if (randSpecial < 0.04) special = SPECIAL_TYPES.RAINBOW;
            else if (randSpecial < 0.08) special = SPECIAL_TYPES.BOMB;
            else if (randSpecial < 0.11) special = SPECIAL_TYPES.LIGHTNING;

            return { colorKey: randomKey, special: special };
        }

        function loadLevelPattern(lvl) {
            initGrid();
            const availableKeys = Object.keys(BUBBLE_COLORS);
            const numColors = Math.min(3 + Math.floor((lvl - 1) / 2), availableKeys.length);
            const activeKeys = availableKeys.slice(0, numColors);

            const initialRows = Math.min(4 + Math.floor(lvl / 2), 8);

            for (let r = 0; r < initialRows; r++) {
                const maxC = (r % 2 !== 0) ? GRID_COLS - 1 : GRID_COLS;
                for (let c = 0; c < maxC; c++) {
                    // 根據關卡產生特定圖案或混色
                    if (Math.random() > 0.1) {
                        const colorKey = activeKeys[(r + c + lvl) % activeKeys.length];
                        grid[r][c] = {
                            colorKey: colorKey,
                            special: SPECIAL_TYPES.NONE,
                            active: true,
                            scale: 1,
                            alpha: 1
                        };
                    }
                }
            }
        }

        // --- 6. CANNON & AIMING SYSTEM ---
        const cannon = {
            x: 0,
            y: 0,
            angle: -Math.PI / 2, // 向上
            currentBubble: null,
            nextBubble: null,
            recoil: 0,
            charState: 'idle' // 'idle', 'shoot', 'happy', 'sad'
        };

        function initCannon() {
            cannon.x = gameArea.x + gameArea.width / 2;
            cannon.y = gameArea.height - Math.max(60, bubbleRadius * 2.5);
            cannon.angle = -Math.PI / 2;
            cannon.recoil = 0;
            
            const activeColors = getAvailableColorsInGrid();
            cannon.currentBubble = createRandomBubbleData(activeColors);
            cannon.nextBubble = createRandomBubbleData(activeColors);
        }

        function reloadCannon() {
            const activeColors = getAvailableColorsInGrid();
            cannon.currentBubble = cannon.nextBubble;
            cannon.nextBubble = createRandomBubbleData(activeColors);
        }

        // 瞄準線反彈計算
        function calculateAimPath() {
            const path = [];
            let currX = cannon.x;
            let currY = cannon.y;
            let dirX = Math.cos(cannon.angle);
            let dirY = Math.sin(cannon.angle);

            path.push({ x: currX, y: currY });

            let maxBounce = 3;
            let step = 0;

            const leftWall = gameArea.x + bubbleRadius;
            const rightWall = gameArea.x + gameArea.width - bubbleRadius;

            while (maxBounce > 0 && step < 1000) {
                step++;
                currX += dirX * 5;
                currY += dirY * 5;

                // 牆壁碰撞
                if (currX <= leftWall) {
                    currX = leftWall;
                    dirX *= -1;
                    path.push({ x: currX, y: currY });
                    maxBounce--;
                } else if (currX >= rightWall) {
                    currX = rightWall;
                    dirX *= -1;
                    path.push({ x: currX, y: currY });
                    maxBounce--;
                }

                // 觸頂或碰到泡泡時截斷
                if (currY <= gameArea.y + 65 + bubbleRadius) {
                    path.push({ x: currX, y: currY });
                    break;
                }

                // 檢查是否接近任何 Grid 泡泡
                let hit = false;
                for (let r = 0; r < grid.length; r++) {
                    for (let c = 0; c < GRID_COLS; c++) {
                        const b = grid[r][c];
                        if (b && b.active) {
                            const pos = getBubbleCenter(r, c);
                            const dist = Math.hypot(currX - pos.x, currY - pos.y);
                            if (dist < bubbleRadius * 1.8) {
                                hit = true;
                                break;
                            }
                        }
                    }
                    if (hit) break;
                }
                if (hit) {
                    path.push({ x: currX, y: currY });
                    break;
                }
            }
            return path;
        }

        // --- 7. FLYING BUBBLE & PHYSICS ---
        let flyingBubble = null;

        function shootBubble() {
            if (flyingBubble || gameState !== GAME_STATES.PLAYING) return;

            sound.playShoot();
            cannon.recoil = 12;
            cannon.charState = 'shoot';
            setTimeout(() => { if (cannon.charState === 'shoot') cannon.charState = 'idle'; }, 300);

            const speed = 22;
            flyingBubble = {
                x: cannon.x,
                y: cannon.y,
                vx: Math.cos(cannon.angle) * speed,
                vy: Math.sin(cannon.angle) * speed,
                colorKey: cannon.currentBubble.colorKey,
                special: cannon.currentBubble.special,
                trail: []
            };

            reloadCannon();
        }

        function updateFlyingBubble() {
            if (!flyingBubble) return;

            // 軌跡點
            flyingBubble.trail.push({ x: flyingBubble.x, y: flyingBubble.y });
            if (flyingBubble.trail.length > 5) flyingBubble.trail.shift();

            flyingBubble.x += flyingBubble.vx;
            flyingBubble.y += flyingBubble.vy;

            const leftWall = gameArea.x + bubbleRadius;
            const rightWall = gameArea.x + gameArea.width - bubbleRadius;

            // 反彈左牆 / 右牆
            if (flyingBubble.x <= leftWall) {
                flyingBubble.x = leftWall;
                flyingBubble.vx *= -1;
                sound.playBounce();
            } else if (flyingBubble.x >= rightWall) {
                flyingBubble.x = rightWall;
                flyingBubble.vy;
                flyingBubble.vx *= -1;
                sound.playBounce();
            }

            // 觸碰天花板
            if (flyingBubble.y <= gameArea.y + 65 + bubbleRadius) {
                snapFlyingBubbleToGrid();
                return;
            }

            // 碰撞檢查：其他泡泡
            for (let r = 0; r < grid.length; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    const b = grid[r][c];
                    if (b && b.active) {
                        const pos = getBubbleCenter(r, c);
                        const dist = Math.hypot(flyingBubble.x - pos.x, flyingBubble.y - pos.y);
                        if (dist < bubbleRadius * 1.75) {
                            snapFlyingBubbleToGrid();
                            return;
                        }
                    }
                }
            }
        }

        // 找到最接近的空 Grid 位置
        function snapFlyingBubbleToGrid() {
            sound.playSnap();
            let closestSpot = null;
            let minDistance = Infinity;

            for (let r = 0; r < grid.length; r++) {
                const maxC = (r % 2 !== 0) ? GRID_COLS - 1 : GRID_COLS;
                for (let c = 0; c < maxC; c++) {
                    if (!grid[r][c] || !grid[r][c].active) {
                        const pos = getBubbleCenter(r, c);
                        const dist = Math.hypot(flyingBubble.x - pos.x, flyingBubble.y - pos.y);
                        if (dist < minDistance) {
                            minDistance = dist;
                            closestSpot = { row: r, col: c };
                        }
                    }
                }
            }

            if (closestSpot) {
                const { row, col } = closestSpot;
                grid[row][col] = {
                    colorKey: flyingBubble.colorKey,
                    special: flyingBubble.special,
                    active: true,
                    scale: 0.1, // 登場動畫
                    alpha: 1
                };

                createImpactParticles(flyingBubble.x, flyingBubble.y, flyingBubble.colorKey);

                const specialType = flyingBubble.special;
                flyingBubble = null;

                // 處理特殊泡泡或標準消除
                handleBubbleImpact(row, col, specialType);
            } else {
                flyingBubble = null;
            }
        }

        // --- 8. MATCHING, FLOATING & SPECIAL EFFECTS ---
        function handleBubbleImpact(row, col, specialType) {
            if (specialType === SPECIAL_TYPES.BOMB) {
                sound.playExplosion();
                triggerBombEffect(row, col);
                checkFloatingBubblesAndProcess();
                return;
            } else if (specialType === SPECIAL_TYPES.LIGHTNING) {
                sound.playExplosion();
                triggerLightningEffect(row);
                checkFloatingBubblesAndProcess();
                return;
            }

            // 一般/彩虹泡泡消除檢查
            const matched = findConnectedColorMatches(row, col);

            if (matched.length >= 3) {
                combo++;
                sound.playCombo(combo);
                sound.playPop();

                // 算分
                const baseScore = matched.length * 100;
                const comboBonus = (combo - 1) * 200;
                addScore(baseScore + comboBonus);

                // 消除動畫與粒子
                matched.forEach(spot => {
                    const pos = getBubbleCenter(spot.row, spot.col);
                    createPopParticles(pos.x, pos.y, grid[spot.row][spot.col].colorKey);
                    grid[spot.row][spot.col].active = false;
                });

                // 重設連續 Miss
                missCount = 0;
                cannon.charState = 'happy';

                // 處理懸空泡泡
                checkFloatingBubblesAndProcess();
            } else {
                // 未造成消除
                combo = 0;
                missCount++;
                if (missCount >= MISS_LIMIT) {
                    missCount = 0;
                    addNewRowToGrid();
                }
            }

            updateHUD();
            checkGameStates();
        }

        function findConnectedColorMatches(startRow, startCol) {
            const startBubble = grid[startRow][startCol];
            if (!startBubble) return [];

            const targetColor = startBubble.colorKey;
            const visited = new Set();
            const matches = [];
            const queue = [{ row: startRow, col: startCol }];

            visited.add(`${startRow},${startCol}`);

            while (queue.length > 0) {
                const curr = queue.shift();
                matches.push(curr);

                const neighbors = getGridNeighbors(curr.row, curr.col);
                neighbors.forEach(nb => {
                    const key = `${nb.row},${nb.col}`;
                    if (!visited.has(key)) {
                        const nbBubble = grid[nb.row][nb.col];
                        if (nbBubble && nbBubble.active) {
                            // 彩虹泡泡匹配任意色
                            if (nbBubble.colorKey === targetColor ||
                                nbBubble.special === SPECIAL_TYPES.RAINBOW ||
                                startBubble.special === SPECIAL_TYPES.RAINBOW) {
                                visited.add(key);
                                queue.push(nb);
                            }
                        }
                    }
                });
            }
            return matches;
        }

        function getGridNeighbors(row, col) {
            const isOdd = row % 2 !== 0;
            const offsets = isOdd ? [
                { r: -1, c: 0 }, { r: -1, c: 1 },
                { r: 0, c: -1 }, { r: 0, c: 1 },
                { r: 1, c: 0 }, { r: 1, c: 1 }
            ] : [
                { r: -1, c: -1 }, { r: -1, c: 0 },
                { r: 0, c: -1 }, { r: 0, c: 1 },
                { r: 1, c: -1 }, { r: 1, c: 0 }
            ];

            const neighbors = [];
            offsets.forEach(off => {
                const nr = row + off.r;
                const nc = col + off.c;
                const maxC = (nr % 2 !== 0) ? GRID_COLS - 1 : GRID_COLS;
                if (nr >= 0 && nr < grid.length && nc >= 0 && nc < maxC) {
                    neighbors.push({ row: nr, col: nc });
                }
            });
            return neighbors;
        }

        // 懸空泡泡檢測 (Top Ceiling BFS)
        function checkFloatingBubblesAndProcess() {
            const connectedToTop = new Set();
            const queue = [];

            // 第一列所有的 active 泡泡都是懸掛點
            for (let c = 0; c < GRID_COLS; c++) {
                if (grid[0][c] && grid[0][c].active) {
                    queue.push({ row: 0, col: c });
                    connectedToTop.add(`0,${c}`);
                }
            }

            while (queue.length > 0) {
                const curr = queue.shift();
                const neighbors = getGridNeighbors(curr.row, curr.col);
                neighbors.forEach(nb => {
                    const key = `${nb.row},${nb.col}`;
                    if (!connectedToTop.has(key)) {
                        const b = grid[nb.row][nb.col];
                        if (b && b.active) {
                            connectedToTop.add(key);
                            queue.push(nb);
                        }
                    }
                });
            }

            // 找出所有沒連到頂部的 active 泡泡 -> 掉落
            let dropCount = 0;
            for (let r = 0; r < grid.length; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    const b = grid[r][c];
                    if (b && b.active && !connectedToTop.has(`${r},${c}`)) {
                        b.active = false;
                        dropCount++;
                        const pos = getBubbleCenter(r, c);
                        createFallingBubbleEffect(pos.x, pos.y, b.colorKey);
                    }
                }
            }

            if (dropCount > 0) {
                sound.playDrop();
                addScore(dropCount * 150);
            }
        }

        function triggerBombEffect(row, col) {
            const centerPos = getBubbleCenter(row, col);
            createShockwave(centerPos.x, centerPos.y);

            for (let r = Math.max(0, row - 2); r <= Math.min(grid.length - 1, row + 2); r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    if (grid[r][c] && grid[r][c].active) {
                        const pos = getBubbleCenter(r, c);
                        const dist = Math.hypot(pos.x - centerPos.x, pos.y - centerPos.y);
                        if (dist <= bubbleRadius * 3.5) {
                            grid[r][c].active = false;
                            createPopParticles(pos.x, pos.y, grid[r][c].colorKey);
                        }
                    }
                }
            }
            addScore(800);
        }

        function triggerLightningEffect(row) {
            for (let c = 0; c < GRID_COLS; c++) {
                if (grid[row][c] && grid[row][c].active) {
                    grid[row][c].active = false;
                    const pos = getBubbleCenter(row, c);
                    createPopParticles(pos.x, pos.y, '#ffffff');
                }
            }
            addScore(600);
        }

        function addNewRowToGrid() {
            // 向下搬移全體 1 列
            for (let r = grid.length - 1; r > 0; r--) {
                for (let c = 0; c < GRID_COLS; c++) {
                    grid[r][c] = grid[r - 1][c];
                }
            }
            // 新增第 0 列
            grid[0] = [];
            const availableKeys = getAvailableColorsInGrid();
            for (let c = 0; c < GRID_COLS; c++) {
                grid[0][c] = {
                    colorKey: availableKeys[Math.floor(Math.random() * availableKeys.length)],
                    special: SPECIAL_TYPES.NONE,
                    active: true,
                    scale: 1,
                    alpha: 1
                };
            }
        }

        // --- 9. PARTICLE & VISUAL EFFECTS SYSTEM ---
        let particles = [];
        let shockwaves = [];

        function createPopParticles(x, y, colorKey) {
            const color = BUBBLE_COLORS[colorKey] ? BUBBLE_COLORS[colorKey].main : colorKey;
            for (let i = 0; i < 12; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 6;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: 3 + Math.random() * 5,
                    color: color,
                    alpha: 1,
                    life: 1,
                    decay: 0.02 + Math.random() * 0.03
                });
            }
        }

        function createImpactParticles(x, y, colorKey) {
            const color = BUBBLE_COLORS[colorKey] ? BUBBLE_COLORS[colorKey].light : '#ffffff';
            for (let i = 0; i < 6; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 3;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: 2 + Math.random() * 3,
                    color: color,
                    alpha: 1,
                    life: 1,
                    decay: 0.05
                });
            }
        }

        function createFallingBubbleEffect(x, y, colorKey) {
            const color = BUBBLE_COLORS[colorKey] ? BUBBLE_COLORS[colorKey].main : '#ffffff';
            particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 3,
                vy: Math.random() * 2 + 2,
                gravity: 0.3,
                size: bubbleRadius * 0.8,
                color: color,
                alpha: 1,
                life: 1,
                decay: 0.015,
                isFallingBubble: true
            });
        }

        function createShockwave(x, y) {
            shockwaves.push({ x, y, radius: 10, maxRadius: bubbleRadius * 4, alpha: 1 });
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                if (p.gravity) p.vy += p.gravity;
                p.life -= p.decay;
                p.alpha = Math.max(0, p.life);

                if (p.life <= 0) particles.splice(i, 1);
            }

            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const sw = shockwaves[i];
                sw.radius += 8;
                sw.alpha -= 0.04;
                if (sw.alpha <= 0 || sw.radius >= sw.maxRadius) {
                    shockwaves.splice(i, 1);
                }
            }
        }

        // --- 10. RENDER ENGINE (CANVAS DRAWING) ---
        function render() {
            ctx.clearRect(0, 0, viewportWidth, viewportHeight);

            // 背景底色與網點/深色霓虹
            drawBackground();

            // 遊戲區域外框/安全邊界
            drawGameAreaFrame();

            // 繪製 Grid 中的泡泡
            drawGridBubbles();

            // 繪製軌跡/飛翔中泡泡
            drawFlyingBubble();

            // 繪製瞄準線
            if (gameState === GAME_STATES.PLAYING && !flyingBubble) {
                drawAimGuide();
            }

            // 繪製砲台與角色
            drawCannonAndCharacter();

            // 繪製粒子與特效
            drawParticlesAndEffects();

            // 繪製危險警告線
            drawDangerLine();
        }

        function drawBackground() {
            const bgGradient = ctx.createLinearGradient(0, 0, 0, viewportHeight);
            bgGradient.addColorStop(0, '#090d16');
            bgGradient.addColorStop(0.5, '#0f172a');
            bgGradient.addColorStop(1, '#050811');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, viewportWidth, viewportHeight);
        }

        function drawGameAreaFrame() {
            ctx.save();
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.15)';
            ctx.lineWidth = 2;
            ctx.strokeRect(gameArea.x, gameArea.y + 60, gameArea.width, gameArea.height - 60);

            // 頂部天花板裝飾
            ctx.fillStyle = 'rgba(30, 41, 59, 0.8)';
            ctx.fillRect(gameArea.x, gameArea.y + 60, gameArea.width, 10);
            ctx.restore();
        }

        function drawBubble(x, y, radius, colorKey, special = SPECIAL_TYPES.NONE, scale = 1, alpha = 1) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            const colors = BUBBLE_COLORS[colorKey] || BUBBLE_COLORS.RED;

            // 霓虹發光底影
            ctx.shadowColor = colors.shadow;
            ctx.shadowBlur = 10;

            // 泡泡 Radial Gradient (球體立體感)
            const grad = ctx.createRadialGradient(
                -radius * 0.3, -radius * 0.3, radius * 0.1,
                0, 0, radius
            );
            grad.addColorStop(0, colors.light);
            grad.addColorStop(0.6, colors.main);
            grad.addColorStop(1, colors.dark);

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();

            // 玻璃高光 (Highlight)
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.beginPath();
            ctx.arc(-radius * 0.35, -radius * 0.35, radius * 0.25, 0, Math.PI * 2);
            ctx.fill();

            // 特殊泡泡圖示/效果
            if (special === SPECIAL_TYPES.RAINBOW) {
                ctx.fillStyle = '#ffffff';
                ctx.font = `bold ${radius}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🌈', 0, 2);
            } else if (special === SPECIAL_TYPES.BOMB) {
                ctx.fillStyle = '#ffffff';
                ctx.font = `bold ${radius * 0.9}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('💣', 0, 2);
            } else if (special === SPECIAL_TYPES.LIGHTNING) {
                ctx.fillStyle = '#ffffff';
                ctx.font = `bold ${radius * 0.9}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('⚡', 0, 2);
            }

            ctx.restore();
        }

        function drawGridBubbles() {
            const time = Date.now() * 0.003;
            for (let r = 0; r < grid.length; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    const b = grid[r][c];
                    if (b && b.active) {
                        const pos = getBubbleCenter(r, c);
                        // 呼吸微動效果
                        if (b.scale < 1) b.scale = Math.min(1, b.scale + 0.1);
                        const floatOffset = Math.sin(time + r + c) * 1.2;
                        drawBubble(pos.x, pos.y + floatOffset, bubbleRadius, b.colorKey, b.special, b.scale, b.alpha);
                    }
                }
            }
        }

        function drawFlyingBubble() {
            if (!flyingBubble) return;

            // 拖尾尾跡
            flyingBubble.trail.forEach((pt, idx) => {
                const alpha = (idx + 1) / flyingBubble.trail.length * 0.4;
                const r = bubbleRadius * (0.5 + 0.5 * (idx / flyingBubble.trail.length));
                drawBubble(pt.x, pt.y, r, flyingBubble.colorKey, flyingBubble.special, 1, alpha);
            });

            drawBubble(flyingBubble.x, flyingBubble.y, bubbleRadius, flyingBubble.colorKey, flyingBubble.special);
        }

        function drawAimGuide() {
            const path = calculateAimPath();
            if (path.length < 2) return;

            ctx.save();
            ctx.strokeStyle = activePowerUp === 'aimGuide' ? 'rgba(250, 204, 21, 0.8)' : 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 6]);

            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x, path[i].y);
            }
            ctx.stroke();

            // 終點波紋目標指示
            const lastPt = path[path.length - 1];
            ctx.setLineDash([]);
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.8)';
            ctx.beginPath();
            ctx.arc(lastPt.x, lastPt.y, bubbleRadius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();
        }

        function drawCannonAndCharacter() {
            ctx.save();
            ctx.translate(cannon.x, cannon.y);

            // 1. 繪製可愛小恐龍 (Arcade Character)
            drawCharacterAvatar(0, 35, cannon.charState);

            // 2. 砲台底座
            ctx.fillStyle = '#334155';
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 10, bubbleRadius * 1.6, Math.PI, 0);
            ctx.fill();
            ctx.stroke();

            // 3. 旋轉砲管 (後退後座力)
            ctx.save();
            const recoilX = Math.cos(cannon.angle) * (-cannon.recoil);
            const recoilY = Math.sin(cannon.angle) * (-cannon.recoil);
            ctx.translate(recoilX, recoilY);
            ctx.rotate(cannon.angle + Math.PI / 2);

            if (cannon.recoil > 0) cannon.recoil -= 1;

            ctx.fillStyle = '#1e293b';
            ctx.strokeStyle = '#06b6d4';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(-12, -bubbleRadius * 2.2, 24, bubbleRadius * 2.2, 6);
            ctx.fill();
            ctx.stroke();
            ctx.restore();

            // 4. 當前準備發射泡泡
            if (cannon.currentBubble && !flyingBubble) {
                const bubbleX = Math.cos(cannon.angle) * bubbleRadius * 1.2;
                const bubbleY = Math.sin(cannon.angle) * bubbleRadius * 1.2;
                drawBubble(bubbleX, bubbleY, bubbleRadius, cannon.currentBubble.colorKey, cannon.currentBubble.special);
            }

            // 5. NEXT 預覽泡泡
            if (cannon.nextBubble) {
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('NEXT', -bubbleRadius * 2.5, 10);
                drawBubble(-bubbleRadius * 2.5, -12, bubbleRadius * 0.75, cannon.nextBubble.colorKey, cannon.nextBubble.special);
            }

            ctx.restore();
        }

        function drawCharacterAvatar(x, y, state) {
            ctx.save();
            ctx.translate(x, y);

            // 恐龍身體
            ctx.fillStyle = '#22c55e';
            ctx.beginPath();
            ctx.arc(0, 0, 18, 0, Math.PI * 2);
            ctx.fill();

            // 眼睛
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-6, -4, 5, 0, Math.PI * 2);
            ctx.arc(6, -4, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(-5, -4, 2, 0, Math.PI * 2);
            ctx.arc(7, -4, 2, 0, Math.PI * 2);
            ctx.fill();

            // 嘴巴依表情變更
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            if (state === 'happy') {
                ctx.arc(0, 2, 6, 0, Math.PI);
            } else if (state === 'sad') {
                ctx.arc(0, 8, 6, Math.PI, 0);
            } else {
                ctx.moveTo(-4, 4);
                ctx.lineTo(4, 4);
            }
            ctx.stroke();

            ctx.restore();
        }

        function drawParticlesAndEffects() {
            // 普通與掉落粒子
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                if (p.isFallingBubble) {
                    drawBubble(p.x, p.y, p.size, p.color, SPECIAL_TYPES.NONE, 1, p.alpha);
                } else {
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            });

            // 爆炸 Shockwave
            shockwaves.forEach(sw => {
                ctx.save();
                ctx.globalAlpha = sw.alpha;
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            });
        }

        function drawDangerLine() {
            const dangerY = cannon.y - bubbleRadius * 2.5;
            ctx.save();
            ctx.strokeStyle = 'rgba(239, 68, 68, 0.6)';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 4]);
            ctx.beginPath();
            ctx.moveTo(gameArea.x, dangerY);
            ctx.lineTo(gameArea.x + gameArea.width, dangerY);
            ctx.stroke();

            ctx.fillStyle = 'rgba(239, 68, 68, 0.8)';
            ctx.font = 'bold 10px sans-serif';
            ctx.fillText('DANGER LINE', gameArea.x + 10, dangerY - 4);
            ctx.restore();
        }

        // --- 11. GAME STATE & WIN/LOSE CHECK ---
        function addScore(pts) {
            score += pts;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('pb_highScore', highScore.toString());
            }
        }

        function checkGameStates() {
            // 檢查勝負
            let activeBubbleCount = 0;
            let lowestY = 0;

            for (let r = 0; r < grid.length; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    if (grid[r][c] && grid[r][c].active) {
                        activeBubbleCount++;
                        const pos = getBubbleCenter(r, c);
                        if (pos.y > lowestY) lowestY = pos.y;
                    }
                }
            }

            const dangerY = cannon.y - bubbleRadius * 2.5;

            // 勝條件：場面無泡泡
            if (activeBubbleCount === 0) {
                setGameState(GAME_STATES.LEVEL_CLEAR);
                return;
            }

            // 敗條件：泡泡觸及危險線
            if (lowestY >= dangerY) {
                setGameState(GAME_STATES.GAME_OVER);
            }
        }

        function setGameState(newState) {
            gameState = newState;
            const modalContainer = document.getElementById('modal-container');
            const modalStart = document.getElementById('modal-start');
            const modalPause = document.getElementById('modal-pause');
            const modalClear = document.getElementById('modal-clear');
            const modalGameOver = document.getElementById('modal-gameover');

            // 隱藏全部
            [modalStart, modalPause, modalClear, modalGameOver].forEach(m => m.classList.add('hidden'));

            if (newState === GAME_STATES.MENU) {
                modalContainer.classList.remove('hidden');
                modalStart.classList.remove('hidden');
                document.getElementById('start-high-score').textContent = highScore;
            } else if (newState === GAME_STATES.PLAYING) {
                modalContainer.classList.add('hidden');
                sound.startBGM();
            } else if (newState === GAME_STATES.PAUSED) {
                modalContainer.classList.remove('hidden');
                modalPause.classList.remove('hidden');
            } else if (newState === GAME_STATES.LEVEL_CLEAR) {
                modalContainer.classList.remove('hidden');
                modalClear.classList.remove('hidden');
                sound.playWin();
                cannon.charState = 'happy';
                
                document.getElementById('clear-bonus').textContent = '+1000';
                document.getElementById('clear-combo').textContent = `x${combo}`;
                document.getElementById('clear-total-score').textContent = score + 1000;
                addScore(1000);
            } else if (newState === GAME_STATES.GAME_OVER) {
                modalContainer.classList.remove('hidden');
                modalGameOver.classList.remove('hidden');
                sound.playLose();
                cannon.charState = 'sad';

                document.getElementById('gameover-score').textContent = score;
                document.getElementById('gameover-high').textContent = highScore;

                const newHighTag = document.getElementById('gameover-new-high');
                if (score >= highScore && score > 0) {
                    newHighTag.classList.remove('hidden');
                } else {
                    newHighTag.classList.add('hidden');
                }
            }
            updateHUD();
        }

        function startNewGame() {
            score = 0;
            level = 1;
            combo = 0;
            missCount = 0;
            loadLevelPattern(level);
            initCannon();
            setGameState(GAME_STATES.PLAYING);
        }

        function nextLevel() {
            level++;
            combo = 0;
            missCount = 0;
            loadLevelPattern(level);
            initCannon();
            setGameState(GAME_STATES.PLAYING);
        }

        function updateHUD() {
            document.getElementById('hud-level').textContent = level;
            document.getElementById('hud-score').textContent = score;
            document.getElementById('hud-high').textContent = highScore;
            document.getElementById('hud-combo').textContent = `x${combo}`;
            document.getElementById('hud-miss').textContent = `${missCount}/${MISS_LIMIT}`;
        }

        // --- 12. INPUT CONTROLLER ---
        function updateAimAngle(clientX, clientY) {
            if (gameState !== GAME_STATES.PLAYING) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = clientX - rect.left;
            const mouseY = clientY - rect.top;

            let angle = Math.atan2(mouseY - cannon.y, mouseX - cannon.x);

            // 角度安全限制 (15° ～ 165°)
            const minAngle = -Math.PI + 0.26; // 約 -165 deg
            const maxAngle = -0.26;           // 約 -15 deg

            if (angle > 0) {
                angle = (mouseX < cannon.x) ? minAngle : maxAngle;
            } else {
                angle = Math.max(minAngle, Math.min(maxAngle, angle));
            }

            cannon.angle = angle;
        }

        function bindInputs() {
            // Pointer & Touch Handling
            window.addEventListener('pointermove', (e) => {
                updateAimAngle(e.clientX, e.clientY);
            });

            window.addEventListener('pointerdown', (e) => {
                sound.resume();
                if (gameState === GAME_STATES.PLAYING && e.clientY > 60) {
                    updateAimAngle(e.clientX, e.clientY);
                    shootBubble();
                }
            });

            // Keyboard Controls
            const keys = {};
            window.addEventListener('keydown', (e) => {
                sound.resume();
                keys[e.code] = true;

                if (e.code === 'KeyP' || e.code === 'Escape') {
                    if (gameState === GAME_STATES.PLAYING) setGameState(GAME_STATES.PAUSED);
                    else if (gameState === GAME_STATES.PAUSED) setGameState(GAME_STATES.PLAYING);
                }

                if (e.code === 'Space' && gameState === GAME_STATES.PLAYING) {
                    shootBubble();
                }
            });

            window.addEventListener('keyup', (e) => { keys[e.code] = false; });

            // 鍵盤持續調整砲台角度
            setInterval(() => {
                if (gameState !== GAME_STATES.PLAYING) return;
                const step = 0.04;
                if (keys['ArrowLeft'] || keys['KeyA']) {
                    cannon.angle = Math.max(-Math.PI + 0.26, cannon.angle - step);
                }
                if (keys['ArrowRight'] || keys['KeyD']) {
                    cannon.angle = Math.min(-0.26, cannon.angle + step);
                }
            }, 16);

            // RWD Resizing
            window.addEventListener('resize', resizeCanvas);

            // UI Button Bindings
            document.getElementById('btn-start-game').addEventListener('click', () => { sound.resume(); startNewGame(); });
            document.getElementById('btn-resume').addEventListener('click', () => setGameState(GAME_STATES.PLAYING));
            document.getElementById('btn-pause-restart').addEventListener('click', () => startNewGame());
            document.getElementById('btn-next-level').addEventListener('click', () => nextLevel());
            document.getElementById('btn-gameover-restart').addEventListener('click', () => startNewGame());

            document.getElementById('btn-pause').addEventListener('click', () => {
                if (gameState === GAME_STATES.PLAYING) setGameState(GAME_STATES.PAUSED);
            });
            document.getElementById('btn-restart').addEventListener('click', () => startNewGame());

            // BGM / SFX 切換鈕
            const btnBGM = document.getElementById('btn-bgm');
            const btnSFX = document.getElementById('btn-sfx');

            btnBGM.addEventListener('click', () => {
                sound.bgmEnabled = !sound.bgmEnabled;
                localStorage.setItem('pb_bgm', sound.bgmEnabled.toString());
                btnBGM.textContent = sound.bgmEnabled ? '🎵 ON' : '🎵 OFF';
                sound.setBGMVolume(sound.bgmEnabled ? 0.15 : 0);
            });

            btnSFX.addEventListener('click', () => {
                sound.sfxEnabled = !sound.sfxEnabled;
                localStorage.setItem('pb_sfx', sound.sfxEnabled.toString());
                btnSFX.textContent = sound.sfxEnabled ? '🔊 ON' : '🔊 OFF';
                sound.setSFXVolume(sound.sfxEnabled ? 0.3 : 0);
            });

            btnBGM.textContent = sound.bgmEnabled ? '🎵 ON' : '🎵 OFF';
            btnSFX.textContent = sound.sfxEnabled ? '🔊 ON' : '🔊 OFF';
        }

        // --- 13. MAIN GAME LOOP ---
        function gameLoop(timestamp) {
            if (gameState === GAME_STATES.PLAYING) {
                updateFlyingBubble();
                updateParticles();
            }

            render();
            requestAnimationFrame(gameLoop);
        }

        // --- 14. INITIALIZATION ---
        function init() {
            sound.init();
            resizeCanvas();
            initCannon();
            bindInputs();
            setGameState(GAME_STATES.MENU);
            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('DOMContentLoaded', init);
    })();
    </script>
</body>
</html>
